<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Narrador · Hombres Lobo de Castronegro</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IM+Fell+English&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4efe3;--card:#fffaf0;--ink:#2a2118;--mut:#7a6a55;--acc:#8a5a00;--bd:#d8c9a8;--bad:#a02020;--ok:#2a6a2a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120d0a;--card:#1e1610;--ink:#efe3c8;--mut:#a89878;--acc:#d4a63a;--bd:#4a3a22;--bad:#e05a5a;--ok:#6cc46c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#120d0a;--card:#1e1610;--ink:#efe3c8;--mut:#a89878;--acc:#d4a63a;--bd:#4a3a22;--bad:#e05a5a;--ok:#6cc46c;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--ink);font:17px/1.45 'IM Fell English',Georgia,'Times New Roman',serif;background:radial-gradient(ellipse at top,rgba(212,166,58,.15),transparent 65%) fixed,var(--bg)}
main{max-width:720px;margin:auto;padding:12px}
h1{font:700 1.5rem Cinzel,Georgia,serif;letter-spacing:.12em;color:var(--acc);margin:8px 0 2px;text-align:center;text-shadow:0 1px 0 rgba(0,0,0,.3)}.orn{text-align:center;color:var(--mut);font-style:italic;margin-bottom:8px}.orn::before,.orn::after{content:" ❦ "}
h2{font:700 1rem Cinzel,Georgia,serif;letter-spacing:.06em;color:var(--acc);margin:0 0 8px;text-transform:uppercase}
.card{background:var(--card);border:3px double var(--acc);border-radius:6px;padding:12px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.3),inset 0 0 22px rgba(138,90,0,.12)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--bd)}
.row:last-child{border:0}
button,select,input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button.p{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:bold}
button:disabled{opacity:.4}
.step{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--bd)}
.step input{width:22px;height:22px;margin-top:3px;flex:none}
.step.done{opacity:.45}.step b{color:var(--acc)}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pill{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:3px 10px;font-size:.9rem}
.note{background:var(--bad);color:#fff;border-radius:8px;padding:8px 10px;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.win{background:var(--ok);color:#fff;border-radius:10px;padding:12px;text-align:center;font-size:1.1rem;margin-bottom:12px}
.dead{text-decoration:line-through;opacity:.5}
.pl{display:grid;grid-template-columns:1fr auto;gap:6px;padding:7px 0;border-bottom:1px dashed var(--bd)}
.pl:last-child{border:0}.pl .ctl{display:flex;gap:4px;flex-wrap:wrap}
.pl input{width:100%}.on{background:var(--acc);color:#fff}
.mut{color:var(--mut);font-size:.9rem}.big{font-size:1.1rem}.w{color:var(--bad)}
.tog{display:flex;gap:6px;align-items:center;padding:6px 0}.tog input{width:20px;height:20px}
.ctr{display:flex;gap:8px;align-items:center}.ctr b{min-width:28px;text-align:center}button,.pill,summary{font-family:Cinzel,Georgia,serif}button.p{letter-spacing:.06em}.pill{font-size:.8rem}
button,select,input{min-height:44px;font-size:16px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.tog input,.step input{min-height:0}
.stats{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:6px 0;margin:0 0 8px}
.pl{grid-template-columns:1fr 1fr;align-items:center}.pl .ctl{grid-column:1/-1;justify-content:flex-end}.pl .ctl button{min-width:52px}
.act{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);margin-top:10px}.act button{width:100%;padding:12px;font-size:1.05rem;box-shadow:0 4px 14px rgba(0,0,0,.4)}
#app{display:grid;grid-template-columns:1fr;gap:0 16px}#app>*{grid-column:1/-1}
.cfg{display:grid;grid-template-columns:1fr;gap:0 12px}
@media(min-width:760px){main{max-width:1180px;padding:20px 24px}body{font-size:18px}
#app{grid-template-columns:1fr 1fr}#app>.col{grid-column:auto;align-self:start}
.cfg{grid-template-columns:repeat(3,1fr)}
.pl{grid-template-columns:1fr 170px auto}.pl .ctl{grid-column:auto}
button:hover{filter:brightness(1.12)}}
.lnk{display:inline-block;font-family:Cinzel,Georgia,serif;font-size:.85rem;color:var(--ink);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:11px 12px;text-decoration:none}
</style></head><body><main id="app"></main>

const R={lobo:'Hombre Lobo',albino:'Lobo Albino',aldeano:'Aldeano',vidente:'Vidente',bruja:'Bruja',cazador:'Cazador',cupido:'Cupido',ladron:'El Ladrón',nina:'La Niña'};
const OPT=['vidente','bruja','cazador','cupido','ladron','nina'];
const WOLF=r=>r==='lobo'||r==='albino';
let S={ph:'night',n:10,wolves:2,albino:false,opt:{vidente:true,bruja:true,cazador:true,cupido:false,ladron:false,nina:false},alguacil:true,
 pl:[],night:1,done:{},pot:{vida:true,muerte:true},notes:[],center:[],nt:{v:-1,saved:false,p:-1,a:-1}};
try{const t=localStorage.getItem('narrador_cn');if(t)S=JSON.parse(t)}catch(e){}
const save=()=>{try{localStorage.setItem('narrador_cn',JSON.stringify(S))}catch(e){}};
const specials=()=>OPT.filter(k=>S.opt[k]);
const aldeanos=()=>S.n-S.wolves-(S.albino?1:0)-specials().length;
const E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function ensure(){if(!S.nt)S.nt={v:-1,saved:false,p:-1,a:-1};while(S.pl.length<S.n)S.pl.push({name:'Jugador '+(S.pl.length+1),role:'',alive:true,love:false,sheriff:false});while(S.pl.length>S.n)S.pl.pop()}
function set(k,v){S[k]=v;if(k==='n'&&S.wolves>=S.n)S.wolves=S.n-1;ensure();render()}
function opt(k){S.opt[k]=!S.opt[k];render()}
function comp(){const c=[];for(let i=0;i<S.wolves;i++)c.push('lobo');if(S.albino)c.push('albino');specials().forEach(k=>c.push(k));for(let i=0;i<aldeanos();i++)c.push('aldeano');return c}
function start(){
 const old=S.pl;S.pl=[];for(let i=0;i<S.n;i++)S.pl.push({name:'Jugador '+(i+1),role:'',alive:true,love:false,sheriff:false});
 S.ph='night';S.night=1;S.done={};S.pot={vida:true,muerte:true};S.notes=[];S.center=[];render()}
function deal(){
 const d=comp();if(S.opt.ladron){d.push('aldeano','aldeano')}
 for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]]}
 S.pl.forEach((p,i)=>p.role=d[i]);S.center=S.opt.ladron?d.slice(S.n):[];render()}
function reset(){if(confirm('¿Reiniciar la partida? Se mantiene la configuración y los nombres.')){S.pl.forEach(p=>{p.role='';p.alive=true;p.love=false;p.sheriff=false});S.ph='night';S.night=1;S.done={};S.pot={vida:true,muerte:true};S.notes=[];S.center=[];S.nt={v:-1,saved:false,p:-1,a:-1};render();scrollTo(0,0)}}
function setName(i,v){S.pl[i].name=v||('Jugador '+(i+1));save()}
function setRole(i,v){S.pl[i].role=v;render()}
function tog(i,k){S.pl[i][k]=!S.pl[i][k];if(k==='sheriff'&&S.pl[i].sheriff)S.pl.forEach((p,j)=>{if(j!==i)p.sheriff=false});render()}
function kill(i){
 const p=S.pl[i];
 if(!p.alive){p.alive=true;render();return}
 p.alive=false;S.notes.push('☠ '+p.name+' muere.');
 if(p.role==='cazador')S.notes.push('🏹 '+p.name+' es Cazador: dispara en el acto y se lleva a otro jugador.');
 if(p.sheriff)S.notes.push('★ '+p.name+' era Alguacil: nombra a su sucesor.');
 if(p.love){S.pl.forEach((q,j)=>{if(q.love&&q.alive&&j!==i){q.alive=false;S.notes.push('💔 '+q.name+' muere de pena (enamorado de '+p.name+').');
  if(q.role==='cazador')S.notes.push('🏹 '+q.name+' es Cazador: dispara en el acto.');
  if(q.sheriff)S.notes.push('★ '+q.name+' era Alguacil: nombra a su sucesor.')}})}
 render()}

function setNt(k,v){S.nt[k]=v;render()}
const sel=f=>`<select onchange="setNt('${f}',+this.value)"><option value="-1">— nadie —</option>${S.pl.map((p,i)=>p.alive?`<option value="${i}" ${S.nt[f]===i?'selected':''}>${E(p.name)}</option>`:'').join('')}</select>`;
function chk(k){S.done[k]=!S.done[k];render()}
function pot(k){S.pot[k]=!S.pot[k];render()}
function dismiss(i){S.notes.splice(i,1);render()}
function dawn(){const t=S.nt,P=S.pl;
 if(t.v>=0&&t.saved&&S.pot.vida){S.pot.vida=false;S.notes.push('🧪 La Bruja salvó a '+P[t.v].name+' con la Poción de Vida.')}
 else if(t.v>=0&&P[t.v].alive){S.notes.push('🐺 Los lobos devoraron a '+P[t.v].name+'.');kill(t.v)}
 if(t.p>=0&&S.pot.muerte){S.pot.muerte=false;S.notes.push('🧪 La Bruja envenenó a '+P[t.p].name+' con la Poción de Muerte.');if(P[t.p].alive)kill(t.p)}
 if(t.a>=0&&S.night%2===0&&P[t.a].alive){S.notes.push('🤍 El Lobo Albino eliminó a '+P[t.a].name+'.');kill(t.a)}
 S.nt={v:-1,saved:false,p:-1,a:-1};S.ph='day';S.done={};sfx('dawn');render();scrollTo(0,0)}
function dusk(){S.ph='night';S.night++;S.done={};S.nt={v:-1,saved:false,p:-1,a:-1};sfx('night');render();scrollTo(0,0)}

function steps(){
 const n=S.night,o=S.opt,a=[];
 if(S.ph==='night'){
  if(n===1&&o.ladron)a.push(['ladron','🎭 Ladrón','Despierta al Ladrón: puede cambiar su carta por una de las 2 sobrantes del centro. Si ambas son Lobos, debe quedarse una. Duérmelo.']);
  if(n===1&&o.cupido)a.push(['cupido','💘 Cupido','Despierta a Cupido: señala a 2 jugadores (márcalos con ❤ abajo). Duérmelo. Despierta a los enamorados para que se reconozcan en silencio y duérmelos.']);
  if(o.vidente)a.push(['vidente','🔮 Vidente','Despierta a la Vidente: señala a un jugador y le muestras su carta en secreto. Duérmela.']);
  a.push(['lobos','🐺 Lobos','Despierta a los Hombres Lobo: eligen en silencio a quién devorar'+(o.nina?' (la Niña puede espiar: si la descubres, será la víctima)':'')+'. Anota la víctima. Duérmelos.']);
  if(S.albino)a.push(['albino','🤍 Lobo Albino',n%2===0?'Noche par: despierta al Lobo Albino, que puede eliminar a un lobo de la manada (o pasar). Duérmelo.':'Noche impar: el Lobo Albino NO se despierta aparte (solo actúa en noches pares).']);
  if(o.bruja)a.push(['bruja','🧪 Bruja','Despierta a la Bruja: muéstrale la víctima de los lobos. Puede usar la Poción de Vida (salvarla) y/o la de Muerte (matar a alguien). Duérmela.']);
  a.push(['fin','🌅 Amanecer','Pulsa “Amanecer”: se aplican solas las muertes de la noche (lobos, Bruja, Albino) y te aparecen los avisos.']);
 }else{
  a.push(['anun','📢 Anuncio','Anuncia quién murió esta noche. Cada muerto muestra su carta. Atiende avisos (Cazador, enamorados, Alguacil).']);
  if(n===1&&S.alguacil)a.push(['alg','★ Elegir Alguacil','Los jugadores votan al Alguacil (usa el botón ★ en su fila). Su voto vale doble y desempata.']);
  a.push(['deb','💬 Debate','La aldea debate y sospecha. Tiempo libre.']);
  a.push(['vot','🗳 Votación','Cada jugador vota a un sospechoso. El más votado es eliminado'+(S.alguacil?' (voto del Alguacil = 2; desempata)':'')+'. Marca ☠ al eliminado.']);
  a.push(['noche','🌙 Anochecer','Todos cierran los ojos. Pulsa “Anochecer”.']);
 }
 return a}

function win(){
 const P=S.pl;if(!P.length)return'';
 if(P.some(p=>p.alive&&!p.role))return'';
 const al=P.filter(p=>p.alive);
 if(!al.length)return'💀 Nadie sobrevive.';
 const lv=al.filter(p=>p.love);
 if(al.length===2&&lv.length===2&&WOLF(lv[0].role)!==WOLF(lv[1].role))return'💘 ¡Ganan los Enamorados!';
 const wo=al.filter(p=>WOLF(p.role)),alb=al.filter(p=>p.role==='albino');
 if(alb.length===1&&al.length===1)return'🤍 ¡Gana el Lobo Albino en solitario!';
 if(!wo.length)return'🏘 ¡Gana la Aldea!';
 if(wo.length===al.length)return'🐺 ¡Ganan los Lobos!';
 return''}

  h+=`<details ${S.cfgOpen===false?'':'open'} ontoggle="S.cfgOpen=this.open" style="margin-bottom:12px"><summary class="big" style="cursor:pointer;margin-bottom:8px">⚙ Configuración</summary><div class="cfg"><div class="card"><h2>Partida</h2>

  <div class="card"><h2>Mazo a preparar</h2>
  <div class="big">${S.wolves} Lobo${S.wolves>1?'s':''}${S.albino?' + 1 Lobo Albino':''}${specials().map(k=>' + '+R[k]).join('')} + <b class="${al<0?'w':''}">${al}</b> Aldeano${al===1?'':'s'}</div>
  ${al<0?'<p class="w">Hay más personajes que jugadores. Quita alguno.</p>':''}
  ${S.opt.ladron?'<p class="mut">Con el Ladrón: deja 2 cartas sobrantes boca abajo en el centro (mazo de '+(S.n+2)+' cartas, normalmente 2 aldeanos extra).</p>':''}</div>
  </div></details>`;
 }

  const P=S.pl,alive=P.filter(p=>p.alive),tw=S.wolves+(S.albino?1:0),w=tw-P.filter(p=>!p.alive&&WOLF(p.role)).length,un=P.filter(p=>p.alive&&!p.role).length;
  const wn=win();
  h+=`<div class="stats"><span class="pill">${S.ph==='night'?'🌙 Noche':'☀️ Día'} ${S.night}</span><span class="pill">Vivos: ${alive.length}/${P.length}</span><span class="pill">🐺 ${w}/${tw}</span><span class="pill">🏘 ${alive.length-w}</span></div>`;
  if(wn)h+=`<div class="win">${wn}</div>`;
  h+=S.notes.map((t,i)=>`<div class="note"><span>${E(t)}</span><button onclick="dismiss(${i})">✕</button></div>`).join('');
  h+=`<div class="card col"><h2>${S.ph==='night'?'Guion de la noche '+S.night:'Guion del día '+S.night}</h2>`+
   steps().map(([k,t,d])=>{const key=S.ph+S.night+k,dn=S.done[key];
    return `<div class="step ${dn?'done':''}"><input type="checkbox" ${dn?'checked':''} onchange="chk('${key}')"><div><b>${t}</b><div>${d}</div>${k==='lobos'?`<div class="tog">Víctima de los lobos: ${sel('v')}</div>`:''}${k==='albino'&&S.night%2===0?`<div class="tog">Lobo eliminado: ${sel('a')}</div>`:''}${k==='bruja'?`<div class="tog"><button class="${S.nt.saved?'on':''}" ${S.pot.vida?'':'disabled'} onclick="setNt('saved',!S.nt.saved)">🧪 Salvar a la víctima (Poción de Vida)</button></div><div class="tog">☠ Envenenar (Poción de Muerte): ${S.pot.muerte?sel('p'):'<span class="mut">usada</span>'}</div>`:''}${k==='bruja'?`<div class="tog">Pociones: <button class="${S.pot.vida?'on':''}" onclick="pot('vida')">Vida ${S.pot.vida?'disponible':'usada'}</button><button class="${S.pot.muerte?'on':''}" onclick="pot('muerte')">Muerte ${S.pot.muerte?'disponible':'usada'}</button></div>`:''}</div></div>`}).join('')+
   `<div class="act">${S.ph==='night'?'<button class="p" style="width:100%;padding:10px" onclick="dawn()">☀️ Amanecer</button>':'<button class="p" style="width:100%;padding:10px" onclick="dusk()">🌙 Anochecer</button>'}</div></div>`;
  h+=`<div class="card col"><h2>Jugadores</h2><div class="row"><button onclick="deal()">🎲 Repartir roles al azar</button><span class="mut">o elígelos a mano</span></div>`+
   (S.center.length?`<p class="mut">Cartas del centro (Ladrón): ${S.center.map(r=>R[r]).join(', ')}</p>`:'')+
   P.map((p,i)=>`<div class="pl"><div class="${p.alive?'':'dead'}"><input value="${E(p.name)}" onchange="setName(${i},this.value)"></div>
   <select onchange="setRole(${i},this.value)"><option value="">❓ Rol</option>${[...new Set(comp().concat(['aldeano']))].map(r=>`<option value="${r}" ${p.role===r?'selected':''}>${R[r]}</option>`).join('')}</select>
   <div class="ctl"><button onclick="kill(${i})">${p.alive?'☠':'↺'}</button><button class="${p.love?'on':''}" onclick="tog(${i},'love')">❤</button>${S.alguacil?`<button class="${p.sheriff?'on':''}" onclick="tog(${i},'sheriff')">★</button>`:''}</div></div>`).join('')+
   `<p class="mut">☠ muerto/revivir · ❤ enamorado · ★ Alguacil. Si un enamorado muere, el otro cae solo y se avisan Cazador y Alguacil.</p></div>
   <button onclick="reset()" style="width:100%">↺ Reiniciar partida</button>`;
 }
 A.innerHTML=h}
if(S.ph==='setup')S.ph='night';ensure();render();
</script></body></html>
